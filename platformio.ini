; Chronolab Puzzlebox — multi-node PlatformIO project
;
; Four independent MCU nodes, one PlatformIO workspace. See
; spec/puzzlebox_hw.md for the full hardware reference (pin maps, bus
; inventory, networking, bring-up sequence).
;
;   main_controller     ESP32 DevKit V1     firmware/main/src
;   c3_sidecar           ESP32-C3 OLED       firmware/sidecar/src
;   s3_display            ESP32-S3 800x480    firmware/display/src (ESP32_8048S050C)
;   round_display_2424    ESP32-C3 240x240    firmware/display/src (ESP32_2424S012N)
;
; PlatformIO Core (6.1.19 at time of writing) does not support a
; per-environment src_dir override, so all four nodes share one project
; src_dir ("firmware") and each environment's build_src_filter selects only
; its own node's subfolder. Each environment adds its own node's src folder
; back onto the include path explicitly, since PROJECT_SRC_DIR now points at
; "firmware" rather than the node folder.
;
; Build a single node:   platformio run -e main_controller
; Upload a single node:  platformio run -e main_controller -t upload
; Serial monitor:        platformio device monitor -b 115200 -p COMx

[platformio]
default_envs = main_controller, c3_sidecar, s3_display, round_display_2424
src_dir = firmware
boards_dir = boards

[env]
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I firmware/shared/include

; ---------------------------------------------------------------------------
; Main controller — ESP32 DevKit V1. Owns all game logic and puzzle I/O.
; ---------------------------------------------------------------------------
[env:main_controller]
platform = espressif32@6.7.0
board = esp32dev
upload_speed = 115200
extra_scripts = pre:patch_tcpip_adapter.py
build_src_filter = +<main/src/**>
build_flags =
    ${env.build_flags}
    -I firmware/main/src
lib_compat_mode = strict
lib_ignore =
    WiFiEspAT
    QNEthernet
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.5
    miguelbalboa/MFRC522@^1.4.12
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit PWM Servo Driver Library@^3.0.3
    madhephaestus/ESP32Servo@^3.2.1
    bblanchon/ArduinoJson@^7.4.3
    Preferences
    https://github.com/me-no-dev/AsyncTCP
    https://github.com/me-no-dev/ESPAsyncWebServer

; ---------------------------------------------------------------------------
; C3 sidecar — ABRobot ESP32-C3 with onboard 0.42" OLED. Output-only beacon.
; ---------------------------------------------------------------------------
[env:c3_sidecar]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
extra_scripts = pre:patch_tcpip_adapter.py
build_src_filter = +<sidecar/src/**>
build_flags =
    ${env.build_flags}
    -I firmware/sidecar/src
lib_deps =
    olikraus/U8g2@^2.36.18
    Preferences

; ---------------------------------------------------------------------------
; Main display — Sunton ESP32-8048S050C. ESP32-S3, 800x480 IPS + touch.
; ---------------------------------------------------------------------------
[env:s3_display]
platform = espressif32@6.7.0
board = esp32-8048S050C
extra_scripts = pre:patch_tcpip_adapter.py
build_src_filter = +<display/src/**>
build_flags =
    ${env.build_flags}
    -I firmware/display/src
    -DESP32_8048S050C
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_AUDIO
    -DFB_IN_PSRAM=true
    -DLV_CONF_INCLUDE_SIMPLE
board_build.partitions = default_16MB.csv
lib_compat_mode = strict
lib_ignore = WiFiEspAT, WiFi101, WiFi101_Generic, QNEthernet
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    Preferences
; Pinned (not ^-ranged) on purpose: this platform bundles arduino-esp32 core
; 2.0.17, and GFX Library for Arduino versions from mid-2024 onward assume
; core 3.x's esp32-hal-periman.h even for the ESP32S3 RGB panel bus this
; board needs. 1.5.9 is the newest release that both still avoids that
; dependency AND has the bounce_buffer_size_px parameter (needed to fix RGB
; panel flicker on this PSRAM-framebuffer board) — 1.4.x predates that
; parameter entirely.
    moononournation/GFX Library for Arduino@1.5.9
; The main screen only renders correctly through LVGL, not raw Arduino_GFX
; draw calls (hardware-confirmed) — GameView owns an LVGL display driver on
; top of the Arduino_GFX RGB panel bus above. lv_conf.h lives in
; firmware/display/src (see LV_CONF_INCLUDE_SIMPLE above).
    lvgl/lvgl@^9

; ---------------------------------------------------------------------------
; Round display — Sunton ESP32-2424S012N. ESP32-C3, 240x240 round GC9A01.
; ---------------------------------------------------------------------------
[env:round_display_2424]
platform = espressif32@6.7.0
board = esp32-2424S012N
extra_scripts = pre:patch_tcpip_adapter.py
; game_view.cpp, display_speaker_service.cpp and touch_service.cpp are
; S3-only (RGB panel + GFX library, I2S audio, GT911 touch — none of which
; this board has, see spec/components.md); keep them out of this env
; entirely rather than relying only on their #ifdef guards, since the GFX
; library isn't even a lib_dep here.
build_src_filter =
    +<display/src/**>
    -<display/src/game_view.cpp>
    -<display/src/display_speaker_service.cpp>
    -<display/src/touch_service.cpp>
build_flags =
    ${env.build_flags}
    -I firmware/display/src
    -DESP32_2424S012N
; Do not switch back to the default partition table — the OTA app slots
; only fit alongside the 4MB flash on this board with min_spiffs.
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    Preferences
